name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Stage Snes9x WebAssembly runtime
        run: |
          mkdir -p public/core
          cp node_modules/@wasm-gaming/snes9x-wasm/dist/snes9x/snes9x.js public/core/snes9x.js
          cp node_modules/@wasm-gaming/snes9x-wasm/dist/snes9x/snes9x.wasm public/core/snes9x.wasm
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
